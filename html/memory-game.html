<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="记忆卡牌小游戏 - PRE Launcher">
    <meta name="theme-color" content="#667eea">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>记忆卡牌小游戏</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="stylesheet" href="../css/homepage.css">
    <link rel="stylesheet" href="../css/achievement.css">
    <link rel="stylesheet" href="../css/fkgame.css">
    <style>
        .game-board {
            display: grid;
            gap: 10px;
            margin: 20px 0;
            justify-content: center;
            padding: 20px;
            background-color: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 10px;
            min-height: 400px;
        }
        
        .card {
            width: 80px;
            height: 120px;
            background-color: #3498db;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            perspective: 1000px;
        }
        
        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }
        
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        
        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card-front {
            background-color: #3498db;
            color: white;
            font-size: 24px;
        }
        
        .card-back {
            background-color: white;
            color: #333;
            font-size: 32px;
            transform: rotateY(180deg);
            border: 2px solid #ddd;
        }
        
        .card.matched {
            background-color: #2ecc71;
            cursor: default;
        }
        
        .game-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .control-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            background-color: #48bb78;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        
        .control-btn:hover {
            background-color: #38a169;
        }
        
        .control-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        
        .game-message {
            text-align: center;
            margin: 20px 0;
            font-size: 18px;
            font-weight: bold;
            color: #e53e3e;
        }
    </style>
    <script src="../js/developer-config.js"></script>
    <script src="../js/versionManager.js"></script>
</head>
<body>
    <div class="settings-container">
        <div class="settings-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-avatar">
                    <i class="fas fa-memory"></i>
                </div>
                <div class="sidebar-user-info">
                    <div class="sidebar-username">记忆卡牌游戏</div>
                    <div class="sidebar-uid">RC 1.0.0</div>
                </div>
            </div>
            
            <div class="sidebar-menu">
                <div class="menu-item menu-header">
                    <span>游戏控制</span>
                </div>
                <div class="menu-item" id="sidebarStartGameBtn">
                    <i class="fas fa-play-circle"></i>
                    <span>开始游戏</span>
                </div>
                <div class="menu-item" id="sidebarResetGameBtn">
                    <i class="fas fa-redo"></i>
                    <span>重置游戏</span>
                </div>
                <div class="menu-item" id="sidebarAchievementBtn">
                    <i class="fas fa-trophy"></i>
                    <span>成就</span>
                </div>
                <div class="menu-item" id="sidebarUpdateBtn">
                    <i class="fas fa-bell"></i>
                    <span>版本更新公告</span>
                </div>
                <div class="menu-item" id="sidebarLangSwitchBtn">
                    <i class="fas fa-language"></i>
                    <span>切换语言</span>
                </div>
                <div class="menu-item" id="sidebarBackHomeBtn">
                    <i class="fas fa-home"></i>
                    <span>返回首页</span>
                </div>
            </div>
            
            <div class="sidebar-footer">
                <div class="user-center" id="userCenter">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-info">
                        <div class="user-name" id="userName">未登录</div>
                        <div class="user-id" id="userId">ID: ---</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="game-main-content">
            <div class="game-header">
                <h1>记忆卡牌游戏</h1>
                <p>经典的记忆卡牌游戏，翻转卡片找到配对的卡牌</p>
            </div>
            
            <div class="game-body">
                <div class="game-info-bar">
                    <div class="game-info-item">得分: <span id="score">0</span></div>
                    <div class="game-info-item">时间: <span id="time">0</span>s</div>
                    <div class="game-info-item">尝试次数: <span id="attempts">0</span></div>
                    <div class="difficulty-select-container">
                        难度: 
                        <select class="difficulty-select" id="difficultySelect">
                            <option value="easy">简单 (4x4)</option>
                            <option value="medium">中等 (6x6)</option>
                            <option value="hard">困难 (8x8)</option>
                        </select>
                    </div>
                </div>
                
                <div class="game-area-wrapper">
                    <div class="game-message" id="gameMessage"></div>
                    <div class="game-board" id="gameBoard"></div>
                </div>
                
                <div class="game-controls">
                    <button class="control-btn" id="startGameBtn">开始游戏</button>
                    <button class="control-btn" id="resetGameBtn">重置游戏</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 游戏变量
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let score = 0;
        let attempts = 0;
        let gameTime = 0;
        let gameInterval = null;
        let gameStarted = false;
        let difficulty = 'easy';
        
        // 卡牌图标
        const cardIcons = [
            '&#9829;', '&#9830;', '&#9827;', '&#9824;',
            '&#9728;', '&#9730;', '&#9731;', '&#9733;',
            '&#9742;', '&#9749;', '&#9752;', '&#9786;',
            '&#9787;', '&#9792;', '&#9794;', '&#9800;',
            '&#9801;', '&#9802;', '&#9803;', '&#9804;',
            '&#9805;', '&#9806;', '&#9807;', '&#9808;',
            '&#9809;', '&#9810;', '&#9811;', '&#9812;',
            '&#9813;', '&#9814;', '&#9815;', '&#9816;'
        ];
        
        // 初始化游戏
        function initGame() {
            // 重置游戏变量
            cards = [];
            flippedCards = [];
            matchedPairs = 0;
            score = 0;
            attempts = 0;
            gameTime = 0;
            gameStarted = false;
            
            // 清除定时器
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
            
            // 更新UI
            document.getElementById('score').textContent = score;
            document.getElementById('time').textContent = gameTime;
            document.getElementById('attempts').textContent = attempts;
            document.getElementById('gameMessage').textContent = '';
            
            // 根据难度设置游戏板
            setupGameBoard();
        }
        
        // 设置游戏板
        function setupGameBoard() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            
            // 根据难度设置行列数
            let rows, cols;
            switch (difficulty) {
                case 'easy':
                    rows = 4;
                    cols = 4;
                    break;
                case 'medium':
                    rows = 6;
                    cols = 6;
                    break;
                case 'hard':
                    rows = 8;
                    cols = 8;
                    break;
            }
            
            // 设置游戏板网格
            gameBoard.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
            gameBoard.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            
            // 生成卡牌
            const totalCards = rows * cols;
            const pairs = totalCards / 2;
            
            // 选择图标
            const selectedIcons = cardIcons.slice(0, pairs);
            // 复制图标以创建配对
            const iconPairs = [...selectedIcons, ...selectedIcons];
            // 打乱图标
            shuffleArray(iconPairs);
            
            // 创建卡牌
            for (let i = 0; i < totalCards; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = i;
                
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <i class="fas fa-question"></i>
                        </div>
                        <div class="card-back">
                            ${iconPairs[i]}
                        </div>
                    </div>
                `;
                
                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
                cards.push(card);
            }
        }
        
        // 翻转卡牌
        function flipCard() {
            if (!gameStarted) return;
            
            const card = this;
            
            // 检查卡牌是否已经翻转或匹配
            if (card.classList.contains('flipped') || card.classList.contains('matched')) {
                return;
            }
            
            // 翻转卡牌
            card.classList.add('flipped');
            flippedCards.push(card);
            
            // 检查是否翻转了两张卡牌
            if (flippedCards.length === 2) {
                attempts++;
                document.getElementById('attempts').textContent = attempts;
                
                // 检查是否匹配
                const card1 = flippedCards[0];
                const card2 = flippedCards[1];
                
                if (card1.querySelector('.card-back').innerHTML === card2.querySelector('.card-back').innerHTML) {
                    // 匹配成功
                    setTimeout(() => {
                        card1.classList.add('matched');
                        card2.classList.add('matched');
                        matchedPairs++;
                        score += 10;
                        document.getElementById('score').textContent = score;
                        flippedCards = [];
                        
                        // 检查游戏是否结束
                        checkGameEnd();
                    }, 500);
                } else {
                    // 匹配失败
                    setTimeout(() => {
                        card1.classList.remove('flipped');
                        card2.classList.remove('flipped');
                        flippedCards = [];
                    }, 1000);
                }
            }
        }
        
        // 检查游戏是否结束
        function checkGameEnd() {
            const totalPairs = cards.length / 2;
            if (matchedPairs === totalPairs) {
                // 游戏结束
                gameStarted = false;
                clearInterval(gameInterval);
                
                const gameMessage = document.getElementById('gameMessage');
                gameMessage.textContent = `游戏结束！得分: ${score}, 尝试次数: ${attempts}, 用时: ${gameTime}秒`;
            }
        }
        
        // 开始游戏
        function startGame() {
            if (gameStarted) return;
            
            gameStarted = true;
            
            // 开始计时
            gameInterval = setInterval(() => {
                gameTime++;
                document.getElementById('time').textContent = gameTime;
            }, 1000);
            
            document.getElementById('gameMessage').textContent = '游戏开始！';
        }
        
        // 重置游戏
        function resetGame() {
            initGame();
        }
        
        // 打乱数组
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        
        // 事件监听器
        document.getElementById('startGameBtn').addEventListener('click', startGame);
        document.getElementById('resetGameBtn').addEventListener('click', resetGame);
        document.getElementById('difficultySelect').addEventListener('change', function() {
            difficulty = this.value;
            initGame();
        });
        
        // 侧边栏按钮事件
        document.getElementById('sidebarStartGameBtn').addEventListener('click', startGame);
        document.getElementById('sidebarResetGameBtn').addEventListener('click', resetGame);
        document.getElementById('sidebarBackHomeBtn').addEventListener('click', function() {
            window.location.href = 'homepage4.0.html';
        });
        
        // 初始化游戏
        initGame();
    </script>
</body>
</html>
