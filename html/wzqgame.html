<!DOCTYPE html>

<script src="../js/game-stats.js"></script>

<body data-game-id="game_wzq">
    <!-- 浮动光斑装饰 -->
    <div class="blob" style="width:520px;height:520px;top:-120px;left:-120px;background:#d45d79;"></div>
    <div class="blob" style="width:420px;height:420px;bottom:-80px;right:-60px;background:#f0a050;"></div>

    <!-- ===== 顶部导航栏 ===== -->

            </button>
            <button id="pauseBtn" class="glass hud-chip hidden-overlay" title="暂停">

            </button>
            <a href="../index.html" class="glass hud-chip" title="返回主页">

    <!-- ===== 3D 棋盘区域 ===== -->
    <div class="fixed inset-0 flex items-center justify-center" style="padding-top:80px;padding-bottom:120px;">
        <div class="board-3d-container">
            <div class="board-3d-wrapper" id="boardWrapper">
                <div class="board-base" id="boardBase">
                    <div class="board-surface">
                        <div class="board-grid" id="boardGrid"></div>
                    </div>

    </div>

    <!-- ===== 左侧缩放滑块 ===== -->

        <i class="fas fa-search-plus zoom-icon" id="zoomInIcon"></i>
        <input type="range" id="zoomRange" min="60" max="140" value="100" step="2" orient="vertical">
        <i class="fas fa-search-minus zoom-icon" id="zoomOutIcon"></i>
        <span class="zoom-val" id="zoomVal">100%</span>
    </div>

    <!-- ===== 底部控制栏 ===== -->
    <div class="fixed bottom-0 left-0 right-0 z-40 p-4">
        <div class="bottom-bar">
            <div class="glass custom-option difficulty-box" id="difficultyBox" style="padding:0.5rem 0.75rem;">
                <span class="custom-option-label"><i class="fas fa-gauge mr-1 text-pre-accent"></i>难度</span>
                <div class="seg-control" id="difficultySeg">
                    <button class="seg-btn active" data-difficulty="easy">简单</button>
                    <button class="seg-btn" data-difficulty="medium">中等</button>
                    <button class="seg-btn" data-difficulty="hard">困难</button>
                </div>
            </div>
            <div class="glass custom-option" style="padding:0.5rem 0.75rem;">
                <span class="custom-option-label"><i class="fas fa-clock mr-1 text-pre-primary"></i>时间</span>
                <div class="seg-control" id="timeSeg">
                    <button class="seg-btn active" data-time="0">不限</button>
                    <button class="seg-btn" data-time="30">30s</button>
                    <button class="seg-btn" data-time="60">60s</button>
                    <button class="seg-btn" data-time="120">2min</button>
                </div>
            </div>
            <div class="glass custom-option" style="padding:0.5rem 0.75rem;">
                <span class="custom-option-label"><i class="fas fa-robot mr-1 text-pre-purple"></i>人机</span>
                <div class="ai-switch-wrap">
                    <div class="ai-toggle" id="aiToggle">
                        <div class="ai-knob"></div>
                    </div>
                </div>
            </div>
            <div class="glass custom-option" style="padding:0.5rem 0.75rem;">
                <span class="custom-option-label"><i class="fas fa-eye mr-1 text-pre-accent"></i>视角</span>
                <div class="seg-control" id="viewSeg">
                    <button class="seg-btn active" data-view="3d">3D</button>
                    <button class="seg-btn" data-view="top">俯视</button>
                </div>
            </div>
            <div class="glass nav-btn" id="rotateBtn">
                <i class="fas fa-sync-alt text-pre-accent"></i>
                <span>旋转</span>
            </div>
            <div class="glass nav-btn" id="resetBtn">
                <i class="fas fa-rotate-left text-pre-primary"></i>
                <span>重置</span>

        </div>
    </div>

    <!-- ===== 成就通知容器 ===== -->
    <div class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 w-80 max-w-[85vw]" id="toastBox"></div>

    <!-- ===== 成就横幅 ===== -->
    <div class="achv-banner" id="achvBanner">
        <div class="banner-icon"><i class="fas fa-trophy"></i></div>
        <div class="banner-text" id="achvBannerText">成就解锁！</div>
    </div>

    <!-- ===== 成就侧边栏 ===== -->
    <div class="achv-sidebar" id="achvSidebar">
        <div class="achv-header">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg flex items-center justify-center text-xl" style="background:linear-gradient(135deg,#f0a050,#d45d79);">
                    <i class="fas fa-trophy text-white"></i>
                </div>
                <div>
                    <h2 class="text-lg font-bold">五子棋成就</h2>
                    <div class="text-xs text-gray-400"><span id="achvUnlockedCount">0</span> / <span id="achvTotalCount">10</span> 已解锁</div>
                </div>

        </div>

    <!-- ===== 排行榜弹窗 ===== -->
    <div class="modal-backdrop" id="rankingBackdrop"></div>
    <div class="overlay overlay-bg hidden-overlay" id="rankingOverlay" style="z-index:55;">
        <div class="ranking-modal-box modal-enter">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold gradient-text"><i class="fas fa-medal mr-2"></i>游戏结束</h2>
                <button class="text-gray-400 hover:text-white text-xl" id="closeRankingBtn"><i class="fas fa-xmark"></i></button>
            </div>
            <div class="text-sm text-gray-400 mb-2">你的最终得分</div>
            <div class="text-4xl font-black stat-num gradient-text mb-4" id="finalScore">0</div>
            <input type="text" class="ranking-input" id="playerName" placeholder="请输入你的名字（最多6字）" maxlength="6">
            <div class="flex gap-3">
                <button class="glow-btn flex-1 py-2.5 rounded-lg bg-gradient-to-r from-pre-accent to-pre-primary font-bold" id="confirmRankingBtn">
                    <i class="fas fa-check mr-1"></i>确认
                </button>
                <button class="glass flex-1 py-2.5 rounded-lg font-bold hover:bg-white/10 transition" id="cancelRankingBtn">
                    取消

            </div>
        </div>

    <div class="overlay hidden-overlay" id="resetOverlay" style="z-index:55;">

            <div class="text-4xl mb-3"><i class="fas fa-triangle-exclamation text-pre-accent"></i></div>

                    <i class="fas fa-check mr-1"></i>确定
                </button>
                <button class="glass flex-1 py-2.5 rounded-lg font-bold hover:bg-white/10 transition" id="cancelResetBtn">
                    取消

        </div>
    </div>

    <!-- ===== 开始界面 ===== -->
    <div class="overlay overlay-bg grid-bg" id="startOverlay">
        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass mb-8">
            <span class="w-2 h-2 rounded-full bg-green-400 pulse-dot"></span>
            <span class="text-sm text-gray-300">CSS 3D Transform · 立体棋盘</span>
        </div>
        <h1 class="text-6xl md:text-7xl font-black mb-4 leading-tight">
            <span class="block">五子</span>
            <span class="block gradient-text">连珠</span>
        </h1>
        <p class="text-lg text-gray-400 mb-8 max-w-xl">
            经典五子棋，黑白对弈。在3D立体棋盘上运筹帷幄，连成五子者胜。
        </p>
        <div class="glass rounded-2xl px-6 py-4 mb-8 text-sm text-gray-300 flex flex-wrap items-center justify-center gap-x-6 gap-y-2">
            <span>黑方先行，轮流落子</span>
            <span>横、竖、斜任意方向连五即胜</span>
            <span>支持人机对战</span>
        </div>
        <button class="glow-btn px-10 py-4 rounded-xl bg-gradient-to-r from-pre-accent to-pre-primary font-bold text-xl" id="startBtn">
            <i class="fas fa-play mr-2"></i>开始游戏
        </button>
    </div>

    <!-- ===== 游戏结束界面 ===== -->
    <div class="overlay overlay-bg hidden-overlay" id="overOverlay">
        <div class="text-6xl mb-2"><i class="fas fa-crown text-pre-accent" id="overIcon"></i></div>
        <h2 class="text-4xl font-black mb-6 gradient-text" id="overTitle">黑方获胜</h2>
        <div class="glass rounded-2xl px-8 py-5 mb-6 flex gap-8">
            <div class="text-center">
                <div class="text-xs text-gray-400 mb-1">得分</div>
                <div class="text-3xl font-black stat-num gradient-text" id="overScore">0</div>
            </div>
            <div class="text-center">
                <div class="text-xs text-gray-400 mb-1">步数</div>
                <div class="text-3xl font-black stat-num" id="overMoves">0</div>
            </div>
        </div>
        <div class="flex gap-3">
            <button class="glow-btn px-6 py-3 rounded-xl bg-gradient-to-r from-pre-accent to-pre-primary font-bold" id="restartBtn">
                <i class="fas fa-rotate-right mr-2"></i>再来一局
            </button>
            <a href="../index.html" class="glass px-6 py-3 rounded-xl font-bold hover:bg-white/10 transition">
                <i class="fas fa-home mr-2"></i>返回主页
            </a>
        </div>
    </div>

<script>
    // ===== 用户与存档 =====
    var currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!currentUser.username) {
        window.location.href = '../index.html';
    }

    function findUser() {
        var users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
        return users.find(function(u) { return u.username === currentUser.username; });
    }
    function saveUser(user) {
        var users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
        var idx = users.findIndex(function(u) { return u.username === currentUser.username; });
        if (idx !== -1) { users[idx] = user; localStorage.setItem('registeredUsers', JSON.stringify(users)); }
    }
    function getGameData(key, def) {
        var u = findUser();
        if (!u || !u.gameData || u.gameData[key] === undefined) return def;
        return u.gameData[key];
    }
    function setGameData(key, val) {
        var u = findUser();
        if (!u) return;
        if (!u.gameData) u.gameData = {};
        u.gameData[key] = val;
        saveUser(u);
    }

    // ===== 全局状态 =====
    var BOARD_SIZE = 15;
    var chessBoard = [];
    var currentPlayer = 'black';
    var gameRunning = false;
    var gameWon = false;
    var score = 0;
    var timeLeft = 0;
    var timeLimit = 0;
    var gameTimer = null;
    var aiMode = false;
    var difficulty = 'easy';
    var totalMoves = 0;
    var winLine = []; // 胜利连线坐标

    // 成就数据
    var wzqAchievements = getGameData('wzqAchievements', []);
    var wzqGamesPlayed = getGameData('wzqGamesPlayed', 0);
    var wzqWins = getGameData('wzqWins', 0);

    // ===== 成就定义 =====
    var wzqAchievementDefs = [
        { id: 'wzq_first_game', name: '初次对弈', desc: '完成第一局五子棋', icon: 'fa-chess-board', condition: function() { return wzqGamesPlayed >= 1; } },
        { id: 'wzq_first_win', name: '首战告捷', desc: '赢得第一局五子棋', icon: 'fa-trophy', condition: function() { return wzqWins >= 1; } },
        { id: 'wzq_win_5', name: '棋艺初成', desc: '累计赢得5局游戏', icon: 'fa-medal', condition: function() { return wzqWins >= 5; } },
        { id: 'wzq_win_10', name: '棋坛新秀', desc: '累计赢得10局游戏', icon: 'fa-star', condition: function() { return wzqWins >= 10; } },
        { id: 'wzq_games_20', name: '棋迷', desc: '累计完成20局游戏', icon: 'fa-gamepad', condition: function() { return wzqGamesPlayed >= 20; } },
        { id: 'wzq_quick_win', name: '速战速决', desc: '在30步内赢得比赛', icon: 'fa-bolt', condition: function() { return false; } },
        { id: 'wzq_long_game', name: '持久战', desc: '完成一局超过100步的对局', icon: 'fa-hourglass-half', condition: function() { return false; } },
        { id: 'wzq_perfect_win', name: '没关就是开了？', desc: '在对手未落子的情况下获胜', icon: 'fa-crown', condition: function() { return false; } },
        { id: 'wzq_ai_master', name: '人机大师', desc: '在AI模式下赢得10局', icon: 'fa-robot', condition: function() { return false; } },
        { id: 'wzq_veteran', name: '五子棋大师', desc: '累计赢得50局游戏', icon: 'fa-chess-king', condition: function() { return wzqWins >= 50; } }
    ];

    // ===== 初始化3D棋盘 =====
    function initChessBoard() {
        var boardGrid = document.getElementById('boardGrid');
        boardGrid.innerHTML = '';

        // 棋盘表面尺寸（百分比）
        var surfaceSize = 100; // board-surface 的百分比
        var padding = 6.67;   // 棋盘边距百分比
        var step = (surfaceSize - padding * 2) / (BOARD_SIZE - 1);

        // 创建网格线
        for (var i = 0; i < BOARD_SIZE; i++) {
            var posH = padding + i * step;
            var posV = padding + i * step;

            // 横线
            var lineH = document.createElement('div');
            lineH.className = 'grid-line-h';
            lineH.style.top = posH + '%';
            boardGrid.appendChild(lineH);

            // 竖线
            var lineV = document.createElement('div');
            lineV.className = 'grid-line-v';
            lineV.style.left = posV + '%';
            boardGrid.appendChild(lineV);
        }

        // 初始化棋盘数据
        chessBoard = [];
        for (var y = 0; y < BOARD_SIZE; y++) {
            chessBoard.push([]);
            for (var x = 0; x < BOARD_SIZE; x++) {
                chessBoard[y].push(null);
            }
        }

        // 创建交叉点（落子点）
        for (var yy = 0; yy < BOARD_SIZE; yy++) {
            for (var xx = 0; xx < BOARD_SIZE; xx++) {
                var cell = document.createElement('div');
                cell.className = 'board-cell';
                cell.dataset.x = xx;
                cell.dataset.y = yy;
                cell.style.left = (padding + xx * step) + '%';
                cell.style.top = (padding + yy * step) + '%';
                (function(x, y) {
                    cell.addEventListener('click', function() { placeChess(x, y); });
                })(xx, yy);
                boardGrid.appendChild(cell);
            }
        }

        updateTurnDisplay();
    }

    // ===== 落子函数 =====
    function placeChess(x, y) {
        if (!gameRunning || gameWon || chessBoard[y][x] !== null) return;

        chessBoard[y][x] = currentPlayer;
        totalMoves++;

        // 创建3D棋子 - 直接定位到 board-grid 避免嵌套 transform 偏移
        var grid = document.getElementById('boardGrid');
        var piece = document.createElement('div');
        piece.className = 'chess-piece-3d ' + currentPlayer;
        // 复用交叉点的百分比坐标
        var surfaceSize = 100;
        var padding = 6.67;
        var step = (surfaceSize - padding * 2) / (BOARD_SIZE - 1);
        piece.style.left = (padding + x * step) + '%';
        piece.style.top = (padding + y * step) + '%';
        piece.dataset.x = x;
        piece.dataset.y = y;
        grid.appendChild(piece);

        // 检查胜负
        var winResult = checkWin(x, y);
        if (winResult) {
            gameWon = true;
            clearInterval(gameTimer);
            winLine = winResult;

            // 高亮胜利棋子
            winResult.forEach(function(pos) {
                var winPiece = document.querySelector('.chess-piece-3d[data-x="' + pos.x + '"][data-y="' + pos.y + '"]');
                if (winPiece) winPiece.classList.add('win-highlight');
            });

            score += currentPlayer === 'black' ? 100 : 50;
            document.getElementById('scoreVal').textContent = score;

            wzqGamesPlayed++;
            if (currentPlayer === 'black') wzqWins++;
            setGameData('wzqGamesPlayed', wzqGamesPlayed);
            setGameData('wzqWins', wzqWins);
            checkAndSaveAchievements();

            // 延迟显示结束界面
            setTimeout(function() { showGameOver(currentPlayer === 'black' ? '黑方获胜' : '白方获胜'); }, 800);
            return;
        }

        // 切换玩家
        currentPlayer = currentPlayer === 'black' ? 'white' : 'black';
        updateTurnDisplay();

        // AI 落子
        if (aiMode && currentPlayer === 'white' && !gameWon) {
            setTimeout(aiMove, 500);
        }
    }

    // ===== 检查胜负 =====
    function checkWin(x, y) {
        var player = chessBoard[y][x];
        var directions = [[0,1],[1,0],[1,1],[1,-1]];

        for (var d = 0; d < directions.length; d++) {
            var dx = directions[d][0], dy = directions[d][1];
            var line = [{x: x, y: y}];

            // 正向
            for (var i = 1; i < 5; i++) {
                var nx = x + dx * i, ny = y + dy * i;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && chessBoard[ny][nx] === player) {
                    line.push({x: nx, y: ny});
                } else break;
            }
            // 反向
            for (var i2 = 1; i2 < 5; i2++) {
                var nx2 = x - dx * i2, ny2 = y - dy * i2;
                if (nx2 >= 0 && nx2 < BOARD_SIZE && ny2 >= 0 && ny2 < BOARD_SIZE && chessBoard[ny2][nx2] === player) {
                    line.unshift({x: nx2, y: ny2});
                } else break;
            }

            if (line.length >= 5) return line;
        }
        return null;
    }

    // ===== AI 评估落子 =====
    function evaluateMove(x, y, player) {
        var s = 0;
        var directions = [[0,1],[1,0],[1,1],[1,-1]];

        for (var d = 0; d < directions.length; d++) {
            var dx = directions[d][0], dy = directions[d][1];
            var count = 1, empty = 0, blocked = 0;

            for (var i = 1; i < 5; i++) {
                var nx = x + dx * i, ny = y + dy * i;
                if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE) { blocked++; break; }
                if (chessBoard[ny][nx] === player) count++;
                else if (chessBoard[ny][nx] === null) { empty++; break; }
                else { blocked++; break; }
            }
            for (var i2 = 1; i2 < 5; i2++) {
                var nx2 = x - dx * i2, ny2 = y - dy * i2;
                if (nx2 < 0 || nx2 >= BOARD_SIZE || ny2 < 0 || ny2 >= BOARD_SIZE) { blocked++; break; }
                if (chessBoard[ny2][nx2] === player) count++;
                else if (chessBoard[ny2][nx2] === null) { empty++; break; }
                else { blocked++; break; }
            }

            if (count >= 5) s += 100000;
            else if (count === 4) {
                if (empty === 2 || (empty === 1 && blocked === 0)) s += 10000;
                else if (empty === 1 && blocked === 1) s += 1000;
            } else if (count === 3) {
                if (empty === 2) s += 1000;
                else if (empty === 1 && blocked === 1) s += 100;
            } else if (count === 2) {
                if (empty === 2) s += 100;
                else if (empty === 1 && blocked === 1) s += 10;
            } else if (count === 1) s += 1;
        }
        return s;
    }

    // ===== AI 落子 =====
    function aiMove() {
        if (!gameRunning || gameWon || !aiMode) return;

        var bestScore = -1, bestMove = null;
        var center = Math.floor(BOARD_SIZE / 2);

        for (var y = 0; y < BOARD_SIZE; y++) {
            for (var x = 0; x < BOARD_SIZE; x++) {
                if (chessBoard[y][x] === null) {
                    // 只考虑已有棋子附近的位置（优化性能）
                    if (totalMoves > 0 && !hasNeighbor(x, y, 2)) continue;

                    var attackScore = evaluateMove(x, y, 'white');
                    var defendScore = evaluateMove(x, y, 'black');

                    // 难度调节
                    var attackWeight = difficulty === 'easy' ? 0.6 : (difficulty === 'medium' ? 0.8 : 1.0);
                    var defendWeight = difficulty === 'easy' ? 0.4 : (difficulty === 'medium' ? 0.7 : 0.9);

                    var totalScore = attackScore * attackWeight + defendScore * defendWeight;
                    // 中心倾向
                    totalScore += (center - Math.abs(x - center) - Math.abs(y - center)) * 0.5;

                    if (totalScore > bestScore) {
                        bestScore = totalScore;
                        bestMove = {x: x, y: y};
                    }
                }
            }
        }

        if (bestMove) {
            placeChess(bestMove.x, bestMove.y);
        }
    }

    // 检查是否有邻近棋子
    function hasNeighbor(x, y, range) {
        for (var dy = -range; dy <= range; dy++) {
            for (var dx = -range; dx <= range; dx++) {
                if (dx === 0 && dy === 0) continue;
                var nx = x + dx, ny = y + dy;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && chessBoard[ny][nx] !== null) {
                    return true;
                }
            }
        }
        return false;
    }

    // ===== 更新显示 =====
    function updateTurnDisplay() {
        var turnEl = document.getElementById('turnVal');
        turnEl.textContent = currentPlayer === 'black' ? '黑方回合' : '白方回合';
        turnEl.style.color = currentPlayer === 'black' ? '#f0a050' : '#9b6dff';
    }

    function updateTimer() {
        if (timeLimit === 0) return;
        timeLeft--;
        document.getElementById('timeVal').textContent = timeLeft + 's';
        if (timeLeft <= 0) {
            clearInterval(gameTimer);
            gameRunning = false;
            gameWon = true;
            showGameOver('时间到');
        }
    }

    // ===== 显示游戏结束 =====
    function showGameOver(title) {
        document.getElementById('overTitle').textContent = title;
        document.getElementById('overScore').textContent = score;
        document.getElementById('overMoves').textContent = totalMoves;
        document.getElementById('overOverlay').classList.remove('hidden-overlay');

        // 记录到新的游戏统计系统
        if (window.GameStatsManager) {
            window.GameStatsManager.recordScore('game_wzq', score);
            if (window.gameTimer) {
                window.gameTimer.stop();
            }
        }

        // 排行榜弹窗也显示
        document.getElementById('finalScore').textContent = score;
        document.getElementById('rankingBackdrop').classList.add('show');
        setTimeout(function() {
            document.getElementById('rankingOverlay').classList.remove('hidden-overlay');
        }, 600);
    }

    // ===== 成就系统 =====
    function checkAndSaveAchievements() {
        wzqAchievementDefs.forEach(function(ach) {
            if (!wzqAchievements.includes(ach.id) && ach.condition()) {
                wzqAchievements.push(ach.id);
                showAchievementToast(ach);
            }
        });
        setGameData('wzqAchievements', wzqAchievements);
        updateAchvBadge();
    }

    function showAchievementToast(a) {
        var box = document.getElementById('toastBox');
        var el = document.createElement('div');
        el.className = 'achv-toast glass rounded-xl p-3 flex items-center gap-3';
        el.innerHTML = '<div class="w-11 h-11 rounded-lg flex items-center justify-center text-xl shrink-0" style="background:linear-gradient(135deg,#f0a050,#d45d79);">' +
            '<i class="fas ' + a.icon + ' text-white"></i></div>' +
            '<div class="min-w-0"><div class="text-[11px] text-pre-accent font-bold tracking-wide">成就解锁</div>' +
            '<div class="font-bold text-sm truncate">' + a.name + '</div>' +
            '<div class="text-xs text-gray-400 truncate">' + a.desc + '</div></div>';
        box.appendChild(el);
        requestAnimationFrame(function() { el.classList.add('show'); });
        if (window.gsap) {
            gsap.from(el, { y: 20, duration: 0.5, ease: 'back.out(1.7)' });
        }
        setTimeout(function() {
            el.classList.remove('show');
            setTimeout(function() { el.remove(); }, 500);
        }, 3600);
        showAchievementBanner(a.name);
    }

    function showAchievementBanner(name) {
        var banner = document.getElementById('achvBanner');
        document.getElementById('achvBannerText').textContent = '成就解锁：' + name;
        banner.classList.remove('hide');
        banner.classList.add('show');
        setTimeout(function() {
            banner.classList.remove('show');
            banner.classList.add('hide');
        }, 2500);
    }

    function updateAchvBadge() {
        document.getElementById('achvBadge').textContent = wzqAchievements.length;
    }

    function renderAchievements() {
        var list = document.getElementById('achvList');
        list.innerHTML = '';
        wzqAchievementDefs.forEach(function(ach) {
            var isUnlocked = wzqAchievements.includes(ach.id);
            var card = document.createElement('div');
            card.className = 'achv-card' + (isUnlocked ? ' unlocked' : '');
            card.innerHTML = '<div class="achv-icon"><i class="fas ' + ach.icon + '"></i></div>' +
                '<div class="achv-info"><div class="achv-name">' + ach.name + '</div>' +
                '<div class="achv-desc">' + ach.desc + '</div></div>' +
                '<div class="achv-status">' + (isUnlocked ? '已解锁' : '未解锁') + '</div>';
            list.appendChild(card);
        });
        document.getElementById('achvUnlockedCount').textContent = wzqAchievements.length;
        document.getElementById('achvTotalCount').textContent = wzqAchievementDefs.length;
    }

    // ===== 事件绑定 =====
    document.getElementById('startBtn').addEventListener('click', function() {
        document.getElementById('startOverlay').classList.add('hidden-overlay');
        startGame();
    });

    document.getElementById('restartBtn').addEventListener('click', function() {
        document.getElementById('overOverlay').classList.add('hidden-overlay');
        document.getElementById('rankingOverlay').classList.add('hidden-overlay');
        document.getElementById('rankingBackdrop').classList.remove('show');
        startGame();
    });

    document.getElementById('pauseBtn').addEventListener('click', function() {
        // 简单暂停/恢复
        if (gameRunning) {
            clearInterval(gameTimer);
            gameRunning = false;
            this.innerHTML = '<i class="fas fa-play"></i>';
            if (window.gameTimer) {
                window.gameTimer.pause();
            }
        } else if (!gameWon) {
            gameRunning = true;
            if (timeLimit > 0) {
                gameTimer = setInterval(updateTimer, 1000);
            }
            this.innerHTML = '<i class="fas fa-pause"></i>';
            if (window.gameTimer) {
                window.gameTimer.resume();
            }
        }
    });

    // 难度切换
    document.getElementById('difficultySeg').addEventListener('click', function(e) {
        if (e.target.classList.contains('seg-btn')) {
            this.querySelectorAll('.seg-btn').forEach(function(b) { b.classList.remove('active'); });
            e.target.classList.add('active');
            difficulty = e.target.dataset.difficulty;
        }
    });

    // 时间切换
    document.getElementById('timeSeg').addEventListener('click', function(e) {
        if (e.target.classList.contains('seg-btn')) {
            this.querySelectorAll('.seg-btn').forEach(function(b) { b.classList.remove('active'); });
            e.target.classList.add('active');
            timeLimit = parseInt(e.target.dataset.time);
            document.getElementById('timeVal').textContent = timeLimit === 0 ? '∞' : timeLimit + 's';
        }
    });

    // AI 开关
    document.getElementById('aiToggle').addEventListener('click', function() {
        aiMode = !aiMode;
        this.classList.toggle('on', aiMode);
        // 控制难度选择的显示
        document.getElementById('difficultyBox').classList.toggle('hidden-diff', !aiMode);
    });
    
    // 初始化：默认隐藏难度选择（因为AI默认关闭）
    document.getElementById('difficultyBox').classList.add('hidden-diff');

    // 缩放滑块
    var zoomRange = document.getElementById('zoomRange');
    var zoomVal = document.getElementById('zoomVal');
    var boardWrapper = document.getElementById('boardWrapper');
    
    function applyZoom(percent) {
        var scale = percent / 100;
        var rotateX = currentView === '3d' ? 52 : 0;
        boardWrapper.style.transform = 'rotateX(' + rotateX + 'deg) rotateZ(' + currentRotation + 'deg) scale(' + scale + ')';
        zoomVal.textContent = percent + '%';
    }
    
    zoomRange.addEventListener('input', function() {
        applyZoom(parseInt(this.value));
    });
    
    // 点击 +/- 图标快速调整
    document.getElementById('zoomInIcon').addEventListener('click', function() {
        var v = Math.min(parseInt(zoomRange.value) + 10, 140);
        zoomRange.value = v;
        applyZoom(v);
    });
    document.getElementById('zoomOutIcon').addEventListener('click', function() {
        var v = Math.max(parseInt(zoomRange.value) - 10, 60);
        zoomRange.value = v;
        applyZoom(v);
    });
    
    // 滚轮缩放支持
    document.querySelector('.board-3d-container').addEventListener('wheel', function(e) {
        e.preventDefault();
        var delta = e.deltaY > 0 ? -4 : 4;
        var v = Math.max(60, Math.min(140, parseInt(zoomRange.value) + delta));
        zoomRange.value = v;
        applyZoom(v);
    }, { passive: false });

    // 视角切换（3D ↔ 俯视）
    var currentView = '3d';
    var currentRotation = 0;
    
    function updateBoardTransform() {
        var scale = parseInt(zoomRange.value) / 100;
        var rotateX = currentView === '3d' ? 52 : 0;
        boardWrapper.style.transform = 'rotateX(' + rotateX + 'deg) rotateZ(' + currentRotation + 'deg) scale(' + scale + ')';
    }
    
    document.getElementById('viewSeg').addEventListener('click', function(e) {
        if (e.target.classList.contains('seg-btn')) {
            this.querySelectorAll('.seg-btn').forEach(function(b) { b.classList.remove('active'); });
            e.target.classList.add('active');
            currentView = e.target.dataset.view;
            updateBoardTransform();
        }
    });
    
    // 旋转90°（带3D动画）
    document.getElementById('rotateBtn').addEventListener('click', function() {
        currentRotation = (currentRotation + 90) % 360;
        var scale = parseInt(zoomRange.value) / 100;
        var rotateX = currentView === '3d' ? 52 : 0;
        boardWrapper.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
        boardWrapper.style.transform = 'rotateX(' + rotateX + 'deg) rotateZ(' + currentRotation + 'deg) scale(' + scale + ')';
        setTimeout(function() {
            boardWrapper.style.transition = 'transform 0.5s ease';
        }, 650);
    });
    
    // 重置按钮 - 弹出确认框
    var resetBackdrop = document.getElementById('resetBackdrop');
    var resetOverlay = document.getElementById('resetOverlay');
    
    document.getElementById('resetBtn').addEventListener('click', function() {
        resetBackdrop.classList.add('show');
        resetOverlay.classList.remove('hidden-overlay');
    });
    document.getElementById('cancelResetBtn').addEventListener('click', function() {
        resetOverlay.classList.add('hidden-overlay');
        resetBackdrop.classList.remove('show');
    });
    resetBackdrop.addEventListener('click', function() {
        resetOverlay.classList.add('hidden-overlay');
        resetBackdrop.classList.remove('show');
    });
    document.getElementById('confirmResetBtn').addEventListener('click', function() {
        resetOverlay.classList.add('hidden-overlay');
        resetBackdrop.classList.remove('show');
        startGame();
    });

    // 成就侧边栏
    document.getElementById('achvBtn').addEventListener('click', function() {
        renderAchievements();
        document.getElementById('achvSidebar').classList.add('open');
    });
    document.getElementById('closeAchvBtn').addEventListener('click', function() {
        document.getElementById('achvSidebar').classList.remove('open');
    });

    // 排行榜弹窗
    document.getElementById('closeRankingBtn').addEventListener('click', function() {
        document.getElementById('rankingOverlay').classList.add('hidden-overlay');
        document.getElementById('rankingBackdrop').classList.remove('show');
    });
    document.getElementById('cancelRankingBtn').addEventListener('click', function() {
        document.getElementById('rankingOverlay').classList.add('hidden-overlay');
        document.getElementById('rankingBackdrop').classList.remove('show');
    });
    document.getElementById('confirmRankingBtn').addEventListener('click', function() {
        var name = document.getElementById('playerName').value.trim() || '匿名玩家';
        var sc = document.getElementById('finalScore').textContent;
        console.log('排行榜：' + name + ' ' + sc + '分');
        document.getElementById('rankingOverlay').classList.add('hidden-overlay');
        document.getElementById('rankingBackdrop').classList.remove('show');
        document.getElementById('playerName').value = '';
    });
    document.getElementById('rankingBackdrop').addEventListener('click', function() {
        document.getElementById('rankingOverlay').classList.add('hidden-overlay');
        this.classList.remove('show');
    });

    // ===== 开始游戏 =====
    function startGame() {
        gameRunning = true;
        gameWon = false;
        score = 0;
        totalMoves = 0;
        currentPlayer = 'black';
        timeLeft = timeLimit;
        winLine = [];

        document.getElementById('scoreVal').textContent = '0';
        document.getElementById('timeVal').textContent = timeLimit === 0 ? '∞' : timeLimit + 's';
        document.getElementById('pauseBtn').classList.remove('hidden-overlay');
        document.getElementById('pauseBtn').innerHTML = '<i class="fas fa-pause"></i>';

        initChessBoard();

        clearInterval(gameTimer);
        if (timeLimit > 0) {
            gameTimer = setInterval(updateTimer, 1000);
        }

        // 启动游戏计时器
        if (window.GameStatsManager && window.GameTimer) {
            if (!window.gameTimer) {
                window.gameTimer = new window.GameTimer('game_wzq');
            }
            window.gameTimer.start();
        }

        // 如果AI模式且白方先行（此处黑方先行，不需要立即AI）
    }

    // ===== 初始化 =====
    updateAchvBadge();
    initChessBoard();
</script>
</body>
</html>
